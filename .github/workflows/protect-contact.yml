name: Protect contact section

on:
  pull_request:
    paths:
      - 'sections/contact.html'
      - 'contact-loader.js'
      - 'forms-api.js'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'
  push:
    branches:
      - main
    paths:
      - 'sections/contact.html'
      - 'contact-loader.js'
      - 'forms-api.js'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'

jobs:
  protect-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check explicit approval token
        shell: bash
        run: |
          set -euo pipefail

          ALLOW_TOKEN='[allow-contact-change]'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMMITS=$(git log --format=%B "origin/${{ github.base_ref }}..HEAD")
          else
            COMMITS=$(git log -1 --format=%B)
          fi

          if echo "$COMMITS" | grep -Fq "$ALLOW_TOKEN"; then
            echo "Contact change explicitly allowed."
            exit 0
          fi

          echo "Protected contact files were modified without $ALLOW_TOKEN."
          echo "Add $ALLOW_TOKEN to the commit message only when the contact section change is intentional."
          exit 1
