name: Protect contact section

on:
  pull_request:
    paths:
      - 'index.html'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'

jobs:
  protect-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate locked contact block
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_HASH='4fa4482102b319c19e11191f4958dfcf0d1f3ada85a776385d744c336cb52aea'
          START='<!-- CONTACT_LOCK_START sha256:4fa4482102b319c19e11191f4958dfcf0d1f3ada85a776385d744c336cb52aea -->'
          END='<!-- CONTACT_LOCK_END -->'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import sys

          expected = os.environ.get('EXPECTED_HASH', '4fa4482102b319c19e11191f4958dfcf0d1f3ada85a776385d744c336cb52aea')
          start = '<!-- CONTACT_LOCK_START sha256:4fa4482102b319c19e11191f4958dfcf0d1f3ada85a776385d744c336cb52aea -->'
          end = '<!-- CONTACT_LOCK_END -->'
          text = Path('index.html').read_text(encoding='utf-8')

          if text.count(start) != 1 or text.count(end) != 1:
              print('Contact lock markers are missing or duplicated.')
              sys.exit(1)

          block = text.split(start, 1)[1].split(end, 1)[0].strip('\n')
          digest = hashlib.sha256((block + '\n').encode('utf-8')).hexdigest()

          if digest != expected:
              print('Protected contact block changed.')
              print(f'Expected: {expected}')
              print(f'Actual:   {digest}')
              print('Do not modify the Contact section in index.html.')
              sys.exit(1)

          print('Protected contact block hash is valid.')
          PY
