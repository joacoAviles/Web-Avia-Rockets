name: Protect contact section

on:
  pull_request:
    paths:
      - 'index.html'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'CONTACT_LOCK.md'
      - '.github/workflows/protect-contact.yml'

jobs:
  protect-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate locked contact block
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          expected = '0ef19d4a6549a5bbeb2a74b13a855e5a090663647ecba013c58a3a0bbce174b0'
          start = '<!-- CONTACT_LOCK_START sha256:0ef19d4a6549a5bbeb2a74b13a855e5a090663647ecba013c58a3a0bbce174b0 -->'
          end = '<!-- CONTACT_LOCK_END -->'
          text = Path('index.html').read_text(encoding='utf-8')

          if text.count(start) != 1 or text.count(end) != 1:
              print('Contact lock markers are missing or duplicated.')
              sys.exit(1)

          block = text.split(start, 1)[1].split(end, 1)[0].strip('\n')
          digest = hashlib.sha256((block + '\n').encode('utf-8')).hexdigest()

          if digest != expected:
              print('Protected contact block changed.')
              print(f'Expected: {expected}')
              print(f'Actual:   {digest}')
              print('Do not modify the Contact section or translations in index.html.')
              sys.exit(1)

          print('Protected contact block and translations hash is valid.')
          PY
