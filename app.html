<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVIA Rockets | Home</title>
  <meta name="description" content="Home interno de AVIA Rockets para administrar líneas de negocio, productos contratados, usuario, plan y configuración." />
  <link rel="canonical" href="https://aviarockets.cl/app.html" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="beta-products.css" />
  <link rel="stylesheet" href="app-home.css?v=legal-causas-20260720-1" />
  <link rel="stylesheet" href="academy-responsive.css?v=academy-mobile-20260622-1" />
  <style>
    body[data-page="app-home"] .app-sidebar-toggle,
    body[data-page="app-home"] .app-side-link {
      display: none !important;
    }

    body[data-page="app-home"] .app-layout.is-compact {
      grid-template-columns: 300px minmax(0, 1fr) !important;
    }

    body[data-page="app-home"] .app-layout.is-compact .app-sidebar {
      align-items: stretch !important;
    }

    body[data-page="app-home"] .app-layout.is-compact .app-user-box small,
    body[data-page="app-home"] .app-layout.is-compact .app-user-box strong,
    body[data-page="app-home"] .app-layout.is-compact .app-product-button span,
    body[data-page="app-home"] .app-layout.is-compact .app-product-button small {
      display: block !important;
    }

    body[data-page="app-home"] .app-layout.is-compact .app-product-button {
      grid-template-columns: 42px minmax(0, 1fr) !important;
      justify-content: initial !important;
    }

    body[data-page="app-home"] .app-sidebar-head {
      align-items: flex-start;
    }

    body[data-page="app-home"] .app-sidebar-head strong {
      display: grid;
      gap: .15rem;
    }

    body[data-page="app-home"] .app-sidebar-head strong small {
      color: var(--muted);
      font-weight: 600;
    }

    body[data-page="app-home"] .app-product-menu-empty,
    body[data-page="app-home"] .app-line-hook {
      border: 1px solid rgba(134, 176, 255, .16);
      border-radius: 18px;
      background: rgba(255, 255, 255, .035);
      color: var(--muted);
      padding: .9rem;
      display: grid;
      gap: .3rem;
    }

    body[data-page="app-home"] .app-product-menu-empty strong,
    body[data-page="app-home"] .app-line-hook strong {
      color: var(--text);
    }

    body[data-page="app-home"] .app-config-row[data-api-hook] {
      border-color: rgba(71, 163, 255, .34);
    }

    body[data-page="app-home"] .nav-panel .app-line-nav {
      border: 0;
      background: transparent;
      color: var(--muted-2);
      cursor: pointer;
      font: inherit;
      font-size: .93rem;
      font-weight: 750;
      padding: .35rem .1rem;
      transition: color var(--transition), text-shadow var(--transition);
    }

    body[data-page="app-home"] .nav-panel .app-line-nav:hover {
      color: #fff;
      text-shadow: 0 0 16px rgba(10, 108, 255, .45);
    }

    body[data-page="app-home"] .nav-panel .app-line-nav.is-active {
      color: var(--primary-3);
    }

    body[data-page="app-home"] .app-config-wheel {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .04);
      color: var(--text);
      cursor: pointer;
      font-weight: 900;
    }

    body[data-page="app-home"] .app-config-wheel::before {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      margin: auto;
      border: 3px solid currentColor;
      border-radius: 50%;
      box-shadow: 0 -9px 0 -6px currentColor, 0 9px 0 -6px currentColor, 9px 0 0 -6px currentColor, -9px 0 0 -6px currentColor;
    }

    body[data-page="app-home"] .app-brand-mark {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 20px;
      border: 1px solid rgba(134, 176, 255, .22);
      background: rgba(255,255,255,.04);
      padding: .35rem;
      margin-bottom: 1rem;
    }

    body[data-page="app-home"] .app-upload-panel {
      display: grid;
      gap: 1rem;
    }

    body[data-page="app-home"] .app-upload-panel input[type="file"],
    body[data-page="app-home"] .app-upload-panel input[type="date"] {
      width: 100%;
      border: 1px solid rgba(134,176,255,.22);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: .85rem;
    }

    @media (max-width: 980px) {
      body[data-page="app-home"] .app-layout.is-compact {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body data-page="app-home">
  <header class="site-header"></header>

  <main class="app-shell">
    <div class="container app-container">
      <div id="app-error" class="app-error" hidden></div>

      <div class="app-layout" id="app-layout">
        <aside class="app-sidebar">
          <div class="app-sidebar-head">
            <strong>Productos<small id="app-sidebar-line-label">OPS</small></strong>
            <button class="app-sidebar-toggle" id="app-sidebar-toggle" type="button" aria-label="Contraer menú">‹</button>
          </div>

          <div class="app-user-box">
            <strong id="app-user-name">Cargando...</strong>
            <small id="app-user-email">-</small>
            <small>Rol: <span id="app-user-role">-</span></small>
          </div>

          <button class="app-side-link is-active" id="app-causes-button" type="button">
            <span>LG</span>
            <span>Legal / Causas</span>
          </button>
          <button class="app-side-link" id="app-config-button" type="button">
            <span>CF</span>
            <span>Configuración</span>
          </button>
          <button class="app-side-link" id="app-logout-button" type="button">
            <span>SA</span>
            <span>Salir</span>
          </button>

          <div class="app-product-menu" id="app-product-menu"></div>
        </aside>

        <section class="app-content">
          <article class="app-main-card">
            <p class="eyebrow" id="app-view-label">Home productivo</p>
            <h1 id="app-product-title">Cargando</h1>
            <p id="app-product-description">Preparando información.</p>

            <div class="app-product-demo" id="app-product-demo"></div>

            <div class="app-stats">
              <div class="app-stat"><small>Causas activas</small><strong id="app-products-count">0</strong></div>
              <div class="app-stat"><small>Causas pausadas</small><strong id="app-demo-source">0</strong></div>
              <div class="app-stat"><small>Correo resumen</small><strong id="app-product-status">-</strong></div>
            </div>

            <div class="app-meta-line">
              <span>Vista: <strong id="app-product-slug">causas</strong></span>
              <span>Rol: <strong id="app-product-role">-</strong></span>
            </div>

            <h2 id="app-config-title">Listado de causas</h2>
            <div class="app-config-grid" id="app-product-config"></div>
          </article>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer footer-clean"></footer>
  <script src="api-config.js"></script>
  <script src="header-standard.js?v=permissions-20260719-2"></script>
  <script src="app-home.js?v=legal-causas-20260720-1"></script>
  <script>
    (function(){
      if (typeof appState === "undefined") return;

      const LINE_KEY = "avia_app_selected_line";
      const LINE_HOME_SUFFIX = "-home";
      const lines = {
        ops: {
          id: "ops",
          label: "OPS",
          eyebrow: "Línea OPS",
          title: "OPS",
          description: "Operación diaria: seguimiento legal, flota, vencimientos y procesos que necesitan control constante.",
          products: ["causes", "technical-reviews"]
        },
        intelligence: {
          id: "intelligence",
          label: "Intelligence",
          eyebrow: "Línea Intelligence",
          title: "Intelligence",
          description: "Datos, tableros, alertas y modelos conectados a la operación. La vista queda preparada para conectar el producto desde la API.",
          products: ["intelligence-dashboard"]
        },
        labs: {
          id: "labs",
          label: "Labs",
          eyebrow: "Línea Labs",
          title: "Labs",
          description: "Academy, conectores y herramientas internas para convertir procesos reales en productos utilizables dentro del login.",
          products: ["pjud-upload", "academy", "api-lab"]
        }
      };

      const catalog = {
        "causes": {
          line: "ops",
          icon: "LG",
          label: "Legal / Causas",
          apiSlug: "legal",
          slugs: ["legal", "causes", "causas", "legal-causas"],
          meta: function(){ return `${appState.causes.length || 0} causas`; }
        },
        "technical-reviews": {
          line: "ops",
          icon: "RT",
          label: "Revisiones Técnicas",
          apiSlug: "revision-tecnica",
          slugs: ["revision-tecnica", "revisiones-tecnicas", "technical-reviews", "flota", "fleet"],
          meta: function(){ return `${appState.vehicles.length || 0} autos`; }
        },
        "intelligence-dashboard": {
          line: "intelligence",
          icon: "IN",
          label: "Dashboards / Datos",
          apiSlug: "intelligence-dashboard",
          slugs: ["intelligence", "data-intelligence", "datos", "dashboards", "demand-intelligence"],
          meta: function(){ return "API pendiente"; },
          title: "Dashboards / Datos",
          description: "Vista reservada para tableros, alertas, proyecciones y lectura de datos operativos. No hace llamadas nuevas todavía."
        },
        "academy": {
          line: "labs",
          icon: "AC",
          label: "Academy",
          apiSlug: "labs-academy",
          slugs: ["labs-academy", "academy", "avia-academy"],
          meta: function(){ return `${appAcademyStats().total_questions || 0} preguntas trazables`; },
          title: "AVIA Academy",
          description: "Motor de aprendizaje con fuentes verificables, reportes de error, progreso por alumno y modos de estudio."
        },
        "pjud-upload": {
          line: "labs",
          icon: "PJ",
          label: "Cargar causas PJUD",
          apiSlug: "pjud-upload",
          slugs: ["pjud-upload", "labs-pjud-upload", "procurador-pjud", "cargar-causas-pjud", "pjud"],
          meta: function(){ return "Excel diario"; },
          title: "Cargar causas PJUD",
          description: "Sube el Excel diario del procurador. La API procesa, concilia y deja el lote listo para revisión."
        },
        "api-lab": {
          line: "labs",
          icon: "API",
          label: "API Lab",
          apiSlug: "api-lab",
          slugs: ["api-lab", "labs-api", "lab-api", "labs-query"],
          meta: function(){ return "Hook listo"; },
          title: "API Lab",
          description: "Vista reservada para consultas directas, conectores internos y pruebas controladas. Queda sin llamada automática a la API."
        }
      };

      appState.selectedLine = localStorage.getItem(LINE_KEY) || "ops";

      function normalize(value){
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }

      function productToken(product){
        return normalize(product?.slug || product?.product_slug || product?.code || product?.key || product?.name || product?.title);
      }

      function permissionProductTokens(){
        const enabled = (product) => product?.enabled !== false && Number(product?.enabled) !== 0;
        const fromProducts = Array.isArray(appState.products) ? appState.products.filter(enabled).map(productToken) : [];
        const fromUserProducts = Array.isArray(appState.user?.products) ? appState.user.products.filter(enabled).map(productToken) : [];
        const fromPermissions = Array.isArray(appState.user?.permissions?.products) ? appState.user.permissions.products.map(normalize) : [];
        const flagProducts = appState.user?.legal_view_enabled === true || Number(appState.user?.legal_view_enabled) === 1 ? ["legal"] : [];
        return [...new Set([...fromProducts, ...fromUserProducts, ...fromPermissions, ...flagProducts].filter(Boolean))];
      }

      function permissionLineTokens(){
        const fromProducts = (Array.isArray(appState.products) ? appState.products : []).filter((product) => product?.enabled !== false && Number(product?.enabled) !== 0)
          .map((product) => normalize(product?.line || product?.product_line || product?.category))
          .filter(Boolean);
        const fromUserProducts = (Array.isArray(appState.user?.products) ? appState.user.products : []).filter((product) => product?.enabled !== false && Number(product?.enabled) !== 0)
          .map((product) => normalize(product?.line || product?.product_line || product?.category))
          .filter(Boolean);
        const fromPermissions = Array.isArray(appState.user?.permissions?.lines) ? appState.user.permissions.lines.map(normalize) : [];
        return [...new Set([...fromProducts, ...fromUserProducts, ...fromPermissions].filter(Boolean))];
      }

      function hasContractedProducts(){
        return permissionProductTokens().length > 0 || permissionLineTokens().length > 0;
      }

      function isLineAllowed(lineId){
        if (!hasContractedProducts()) return false;
        const lineTokens = permissionLineTokens();
        if (lineTokens.includes(normalize(lineId))) return true;
        return Object.keys(catalog).some((view) => catalog[view].line === lineId && isContracted(view));
      }

      function isContracted(view){
        if (!hasContractedProducts()) return false;
        const item = catalog[view];
        if (!item) return false;
        const allowed = item.slugs.map(normalize);
        return permissionProductTokens().some(function(token){ return allowed.includes(token); });
      }

      function allowedLines(){
        return Object.keys(lines).filter(isLineAllowed);
      }

      function firstAllowedLine(){
        return allowedLines()[0] || "labs";
      }

      function itemsForLine(lineId){
        const line = lines[lineId] || lines.ops;
        return line.products.filter(isContracted).map(function(view){
          const item = catalog[view];
          return [view, item.label, item.meta(), item.icon, item.apiSlug];
        });
      }

      function lineForView(view){
        if (String(view || "").endsWith(LINE_HOME_SUFFIX)) return String(view).replace(LINE_HOME_SUFFIX, "");
        return catalog[view]?.line || appState.selectedLine || "ops";
      }

      function homeView(lineId){
        return `${lineId}${LINE_HOME_SUFFIX}`;
      }

      function resolveView(){
        if (appState.view === "settings") return;
        if (!isLineAllowed(appState.selectedLine)) appState.selectedLine = firstAllowedLine();
        const activeLine = lines[appState.selectedLine] ? appState.selectedLine : firstAllowedLine();
        const currentLine = lineForView(appState.view);
        if (currentLine !== activeLine) {
          const first = itemsForLine(activeLine)[0]?.[0];
          appState.view = first || homeView(activeLine);
          return;
        }
        if (catalog[appState.view] && !isContracted(appState.view)) {
          const first = itemsForLine(activeLine)[0]?.[0];
          appState.view = first || homeView(activeLine);
        }
      }

      function updateLineHeader(){
        document.querySelectorAll("[data-app-line]").forEach(function(item){
          item.classList.toggle("is-active", item.dataset.appLine === appState.selectedLine && appState.view !== "settings");
        });
        const label = document.getElementById("app-sidebar-line-label");
        if (label) label.textContent = lines[appState.selectedLine]?.label || "OPS";
      }

      function renderHeader(){
        const header = document.querySelector("header.site-header");
        if (!header) return;
        const nav = header.querySelector(".nav-panel");
        if (!nav) return;
        const lineIds = allowedLines();
        const signature = lineIds.join("|") || "none";
        if (nav.dataset.appHeader === "ready" && nav.dataset.allowedSignature === signature) return;
        nav.dataset.appHeader = "ready";
        nav.dataset.allowedSignature = signature;
        const lineButtons = lineIds.map(function(lineId){
          const line = lines[lineId];
          return `<button class="app-line-nav" data-app-line="${appEscape(lineId)}" type="button">${appEscape(line.label)}</button>`;
        }).join("");
        nav.innerHTML = lineButtons + '<button class="app-config-wheel" id="app-header-settings" type="button" aria-label="Configuración"></button><button class="btn btn-primary btn-nav" id="app-header-logout" type="button">Cerrar sesión</button>';
        nav.querySelectorAll("[data-app-line]").forEach(function(button){
          button.addEventListener("click", async function(){
            await selectLine(button.dataset.appLine || "ops");
          });
        });
        nav.querySelector("#app-header-settings")?.addEventListener("click", async function(){
          appState.view = "settings";
          await appRenderPanel();
        });
        nav.querySelector("#app-header-logout")?.addEventListener("click", function(){
          localStorage.removeItem("avia_auth_token");
          localStorage.removeItem("avia_auth_user");
          window.location.href = "login.html";
        });
        updateLineHeader();
      }

      async function selectLine(lineId){
        appState.selectedLine = lines[lineId] && isLineAllowed(lineId) ? lineId : firstAllowedLine();
        localStorage.setItem(LINE_KEY, appState.selectedLine);
        const first = itemsForLine(appState.selectedLine)[0]?.[0];
        appState.view = first || homeView(appState.selectedLine);
        await appRenderPanel();
      }

      function renderLineHome(lineId){
        const line = lines[lineId] || lines.ops;
        appSetText("app-view-label", line.eyebrow);
        appSetText("app-product-title", line.title);
        appSetText("app-product-description", line.description);
        appSetText("app-product-status", "Sin producto activo");
        appSetText("app-product-slug", line.id);
        const demo = document.getElementById("app-product-demo");
        if (demo) demo.innerHTML = `<div class="app-line-hook"><strong>${appEscape(line.label)}</strong><span>Botón superior activo. Los subproductos aparecerán aquí cuando el perfil los tenga contratado desde la API.</span></div>`;
        const stats = document.querySelectorAll(".app-stat");
        const labels = ["Productos contratados", "Estado API", "Conexión"];
        const values = [String(itemsForLine(line.id).length), "Pendiente", "Preparada"];
        stats.forEach(function(card, index){
          const small = card.querySelector("small");
          const strong = card.querySelector("strong");
          if (small) small.textContent = labels[index] || "-";
          if (strong) strong.textContent = values[index] || "-";
        });
        appSetText("app-config-title", "Productos contratados");
        const config = document.getElementById("app-product-config");
        if (config) {
          config.innerHTML = `<div class="app-config-row" data-api-hook="/api/dashboard.products"><span>Sin subproductos visibles</span><strong>No hay productos contratados para ${appEscape(line.label)}.<br><small>La navegación superior queda fija. Cuando /api/dashboard entregue productos asociados al perfil, se listarán bajo esta línea.</small></strong></div>`;
        }
      }

      function renderPjudUploadProduct(){
        const item = catalog["pjud-upload"];
        appSetText("app-view-label", "Labs · Procurador");
        appSetText("app-product-title", item.title);
        appSetText("app-product-description", "Sube el Excel diario de causas PJUD. AVIA lo compara contra las causas asignadas y prepara el resumen para correo.");
        appSetText("app-product-status", "Habilitado");
        appSetText("app-product-slug", item.apiSlug);
        const statsWrap = document.querySelector(".app-stats");
        if (statsWrap) statsWrap.style.display = "none";
        const demo = document.getElementById("app-product-demo");
        if (demo) {
          demo.innerHTML = `<div class="app-line-hook"><strong>Carga diaria PJUD</strong><span>Selecciona la fecha del informe y el Excel exportado. El sistema hará la conciliación y enviará el correo automáticamente.</span></div>`;
        }
        appSetText("app-config-title", "Cargar Excel de causas PJUD");
        const today = new Date().toISOString().slice(0, 10);
        const config = document.getElementById("app-product-config");
        if (config) {
          config.innerHTML = `<form class="app-config-row" id="pjud-upload-form">
            <span>Archivo diario<br><small>Sube el Excel exportado por el procurador.</small></span>
            <strong class="app-upload-panel">
              <input id="pjud-report-date" name="report_date" type="date" value="${today}" required />
              <input id="pjud-file" name="file" type="file" accept=".xlsx,.xls" required />
              <button class="btn btn-primary" type="submit">Cargar causas PJUD</button>
              <small>Al finalizar, AVIA procesa el archivo y envía el informe automáticamente.</small>
            </strong>
          </form>
          <div class="app-config-row"><span>Resultado</span><strong id="pjud-upload-result">OK o ERROR aparecerá aquí.</strong></div>`;
        }
      }

      async function submitPjudUpload(form){
        const result = document.getElementById("pjud-upload-result");
        const file = form.querySelector("#pjud-file")?.files?.[0];
        const reportDate = form.querySelector("#pjud-report-date")?.value || new Date().toISOString().slice(0, 10);
        if (!file) {
          if (result) result.textContent = "Selecciona un archivo Excel.";
          return;
        }
        const body = new FormData();
        body.append("file", file);
        body.append("report_date", reportDate);
        if (result) result.textContent = "Procesando...";
        const token = appGetToken();
        const response = await fetch(`${AVIA_APP_API}/api/v1/labs/procurador-reports/uploads`, {
          method: "POST",
          headers: token ? { Authorization: `Bearer ${token}` } : {},
          body
        });
        let data = null;
        const text = await response.text();
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
        if (!response.ok) throw new Error(data?.detail || data?.message || text || `Error API ${response.status}`);
        if (result) {
          result.textContent = "OK";
        }
      }

      function renderPlaceholderProduct(view){
        const item = catalog[view];
        if (!item) return renderLineHome(appState.selectedLine);
        appSetText("app-view-label", `${lines[item.line].label} · Producto`);
        appSetText("app-product-title", item.title || item.label);
        appSetText("app-product-description", item.description || "Producto contratado preparado para conexión posterior con API.");
        appSetText("app-product-status", "Conexión pendiente");
        appSetText("app-product-slug", item.apiSlug);
        const demo = document.getElementById("app-product-demo");
        if (demo) {
          demo.innerHTML = `<div class="app-config-grid"><div class="app-config-row" data-api-hook="/api/products/${appEscape(item.apiSlug)}/dashboard"><span>Hook API</span><strong>/api/products/${appEscape(item.apiSlug)}/dashboard<br><small>No se consume todavía. Queda marcado para conectar después sin tocar esta vista.</small></strong></div></div>`;
        }
        const stats = document.querySelectorAll(".app-stat");
        const labels = ["Producto", "API", "Estado"];
        const values = [item.label, item.apiSlug, "Pendiente"];
        stats.forEach(function(card, index){
          const small = card.querySelector("small");
          const strong = card.querySelector("strong");
          if (small) small.textContent = labels[index] || "-";
          if (strong) strong.textContent = values[index] || "-";
        });
        appSetText("app-config-title", "Conexión preparada");
        const config = document.getElementById("app-product-config");
        if (config) {
          config.innerHTML = `<div class="app-config-row" data-api-hook="/api/products/${appEscape(item.apiSlug)}/config"><span>Próximo paso</span><strong>Conectar datos reales desde API.<br><small>Este botón existe sólo en frontend y no modifica backend.</small></strong></div>`;
        }
      }

      appProductItems = function(){
        return itemsForLine(appState.selectedLine);
      };

      appRenderSidebar = function(){
        resolveView();
        updateLineHeader();
        const menu = document.getElementById("app-product-menu");
        if (!menu) return;
        const items = appProductItems();
        if (!items.length) {
          const line = lines[appState.selectedLine] || lines.ops;
          menu.innerHTML = `<div class="app-product-menu-empty"><strong>${appEscape(line.label)}</strong><span>Sin subproductos contratados.</span><small>La API podrá llenar esta lista por slug de producto.</small></div>`;
          return;
        }
        menu.innerHTML = items.map(function(item){
          const view = item[0], label = item[1], meta = item[2], icon = item[3], apiSlug = item[4];
          return `<button class="app-product-button${appState.view === view ? " is-active" : ""}" type="button" data-product-view="${appEscape(view)}" data-api-slug="${appEscape(apiSlug)}"><strong>${appEscape(icon)}</strong><span>${appEscape(label)}</span><small>${appEscape(meta)}</small></button>`;
        }).join("");
      };

      appRenderPanel = async function(){
        renderHeader();
        resolveView();
        document.body.classList.toggle("is-legal-view", appState.view === "causes");
        appRenderSidebar();
        const statsWrap = document.querySelector(".app-stats");
        if (statsWrap) statsWrap.style.display = "";
        if (appState.view === "settings") appRenderSettingsPanel();
        else if (appState.view === "technical-reviews") await appRenderTechnicalReviewsPanel();
        else if (appState.view === "academy") await appRenderAcademyPanel();
        else if (appState.view === "pjud-upload") renderPjudUploadProduct();
        else if (appState.view === "intelligence-dashboard" || appState.view === "api-lab") renderPlaceholderProduct(appState.view);
        else if (String(appState.view || "").endsWith(LINE_HOME_SUFFIX)) renderLineHome(lineForView(appState.view));
        else appRenderLegalPanel();
        appRenderSidebar();
        if (!["intelligence-dashboard", "api-lab", "pjud-upload"].includes(appState.view) && !String(appState.view || "").endsWith(LINE_HOME_SUFFIX)) appRenderStats();
      };

      document.addEventListener("click", async function(event){
        const productButton = event.target.closest("[data-product-view]");
        if (productButton) {
          event.preventDefault();
          appState.view = productButton.dataset.productView || homeView(appState.selectedLine);
          await appRenderPanel();
        }
      });

      document.addEventListener("submit", async function(event){
        const form = event.target.closest("#pjud-upload-form");
        if (!form) return;
        event.preventDefault();
        try {
          await submitPjudUpload(form);
        } catch (error) {
          const result = document.getElementById("pjud-upload-result");
          if (result) result.textContent = `ERROR${error.message ? `: ${error.message}` : ""}`;
        }
      });

      document.addEventListener("DOMContentLoaded", function(){
        renderHeader();
        updateLineHeader();
        const layout = document.getElementById("app-layout");
        if (layout) layout.classList.remove("is-compact");
      });

      setTimeout(function(){ renderHeader(); updateLineHeader(); }, 0);
    })();
  </script>
  <script src="footer-standard.js?v=20260604-3"></script>
</body>
</html>
