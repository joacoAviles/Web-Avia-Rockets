  <script>
    (function(){
      if (typeof appState === "undefined") return;

      const LINE_KEY = "avia_app_selected_line";
      const LINE_HOME_SUFFIX = "-home";
      const lines = {
        legal: {
          id: "legal",
          label: "Legal",
          eyebrow: "Línea Legal",
          title: "Legal",
          description: "Resumen operativo, causas judiciales y revisión de asignación del procurador.",
          products: ["legal-summary", "causes", "pjud-upload"]
        },
        intelligence: {
          id: "intelligence",
          label: "Intelligence",
          eyebrow: "LÃ­nea Intelligence",
          title: "Intelligence",
          description: "Datos, tableros, alertas y modelos conectados a la operaciÃ³n. La vista queda preparada para conectar el producto desde la API.",
          products: ["intelligence-dashboard"]
        },
        labs: {
          id: "labs",
          label: "Labs",
          eyebrow: "LÃ­nea Labs",
          title: "Labs",
          description: "Academy, conectores y herramientas internas para convertir procesos reales en productos utilizables dentro del login.",
          products: ["academy", "api-lab"]
        }
      };

      const catalog = {
        "legal-summary": {
          line: "legal",
          icon: "RS",
          label: "Resumen",
          apiSlug: "legal-summary",
          slugs: ["legal", "legal-summary", "resumen", "legal-resumen"],
          meta: function(){ return `${appState.causes.length || 0} causas`; }
        },
        "causes": {
          line: "legal",
          icon: "CS",
          label: "Causas",
          apiSlug: "causes",
          slugs: ["causes", "causas", "legal-causas"],
          meta: function(){ return `${appState.causes.length || 0} causas`; }
        },
        "technical-reviews": {
          line: "legal",
          icon: "RT",
          label: "Revisiones TÃ©cnicas",
          apiSlug: "revision-tecnica",
          slugs: ["revision-tecnica", "revisiones-tecnicas", "technical-reviews", "flota", "fleet"],
          meta: function(){ return `${appState.vehicles.length || 0} autos`; }
        },
        "intelligence-dashboard": {
          line: "intelligence",
          icon: "IN",
          label: "Dashboards / Datos",
          apiSlug: "intelligence-dashboard",
          slugs: ["intelligence", "data-intelligence", "datos", "dashboards", "demand-intelligence"],
          meta: function(){ return "API pendiente"; },
          title: "Dashboards / Datos",
          description: "Vista reservada para tableros, alertas, proyecciones y lectura de datos operativos. No hace llamadas nuevas todavÃ­a."
        },
        "academy": {
          line: "labs",
          icon: "AC",
          label: "Academy",
          apiSlug: "labs-academy",
          slugs: ["labs-academy", "academy", "avia-academy"],
          meta: function(){ return `${appAcademyStats().total_questions || 0} preguntas trazables`; },
          title: "AVIA Academy",
          description: "Motor de aprendizaje con fuentes verificables, reportes de error, progreso por alumno y modos de estudio."
        },
        "pjud-upload": {
          line: "legal",
          icon: "PJ",
          label: "Procurador",
          apiSlug: "pjud-upload",
          slugs: ["pjud-upload", "labs-pjud-upload", "procurador-pjud", "cargar-causas-pjud", "pjud"],
          meta: function(){ return "Excel diario"; },
          title: "Procurador",
          description: "Sube el Excel diario del procurador. La API procesa, concilia y envía el informe automáticamente."
        },
        "api-lab": {
          line: "labs",
          icon: "API",
          label: "API Lab",
          apiSlug: "api-lab",
          slugs: ["api-lab", "labs-api", "lab-api", "labs-query"],
          meta: function(){ return "Hook listo"; },
          title: "API Lab",
          description: "Vista reservada para consultas directas, conectores internos y pruebas controladas. Queda sin llamada automÃ¡tica a la API."
        }
      };

      appState.selectedLine = localStorage.getItem(LINE_KEY) || "legal";

      function normalize(value){
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }

      function productToken(product){
        if (typeof product === "string") return normalize(product);
        return normalize(product?.slug || product?.product_slug || product?.code || product?.key || product?.name || product?.title);
      }

      function permissionProductTokens(){
        const enabled = (product) => product?.enabled !== false && Number(product?.enabled) !== 0;
        const fromProducts = Array.isArray(appState.products) ? appState.products.filter(enabled).map(productToken) : [];
        const fromUserProducts = Array.isArray(appState.user?.products) ? appState.user.products.filter(enabled).map(productToken) : [];
        const fromPermissions = Array.isArray(appState.user?.permissions?.products) ? appState.user.permissions.products.map(normalize) : [];
        const flagProducts = appState.user?.legal_view_enabled === true || Number(appState.user?.legal_view_enabled) === 1 ? ["legal"] : [];
        return [...new Set([...fromProducts, ...fromUserProducts, ...fromPermissions, ...flagProducts].filter(Boolean))];
      }

      function permissionLineTokens(){
        const fromProducts = (Array.isArray(appState.products) ? appState.products : []).filter((product) => product?.enabled !== false && Number(product?.enabled) !== 0)
          .map((product) => normalize(product?.line || product?.product_line || product?.category))
          .filter(Boolean);
        const fromUserProducts = (Array.isArray(appState.user?.products) ? appState.user.products : []).filter((product) => product?.enabled !== false && Number(product?.enabled) !== 0)
          .map((product) => normalize(product?.line || product?.product_line || product?.category))
          .filter(Boolean);
        const fromPermissions = Array.isArray(appState.user?.permissions?.lines) ? appState.user.permissions.lines.map(normalize) : [];
        return [...new Set([...fromProducts, ...fromUserProducts, ...fromPermissions].filter(Boolean))];
      }

      function hasContractedProducts(){
        return permissionProductTokens().length > 0 || permissionLineTokens().length > 0;
      }

      function isLineAllowed(lineId){
        if (!hasContractedProducts()) return false;
        const lineTokens = permissionLineTokens();
        if (lineTokens.includes(normalize(lineId))) return true;
        return Object.keys(catalog).some((view) => catalog[view].line === lineId && isContracted(view));
      }

      function isContracted(view){
        if (!hasContractedProducts()) return false;
        const item = catalog[view];
        if (!item) return false;
        const allowed = item.slugs.map(normalize);
        return permissionProductTokens().some(function(token){ return allowed.includes(token); });
      }

      function allowedLines(){
        return Object.keys(lines).filter(isLineAllowed);
      }

      function firstAllowedLine(){
        return Object.keys(lines).find(isLineAllowed) || "legal";
      }

      function itemsForLine(lineId){
        const line = lines[lineId] || lines.legal;
        return line.products.filter(isContracted).map(function(view){
          const item = catalog[view];
          return [view, item.label, item.meta(), item.icon, item.apiSlug];
        });
      }

      window.appLegalNavigationItems = function(){
        return itemsForLine("legal").map(function(item){
          return { view: item[0], label: item[1], icon: item[3] };
        });
      };

      window.appNavigateToProductView = async function(view){
        if (!isContracted(view)) return;
        appState.view = view;
        appState.selectedLine = catalog[view]?.line || "legal";
        if (view === "legal-summary") appState.legalTab = "summary";
        if (view === "causes") appState.legalTab = "causes";
        localStorage.setItem(LINE_KEY, appState.selectedLine);
        await appRenderPanel();
      };

      function lineForView(view){
        if (String(view || "").endsWith(LINE_HOME_SUFFIX)) return String(view).replace(LINE_HOME_SUFFIX, "");
        return catalog[view]?.line || appState.selectedLine || "legal";
      }

      function homeView(lineId){
        return `${lineId}${LINE_HOME_SUFFIX}`;
      }

      function resolveView(){
        if (appState.view === "settings") return;
        if (!isLineAllowed(appState.selectedLine)) appState.selectedLine = firstAllowedLine();
        const activeLine = lines[appState.selectedLine] ? appState.selectedLine : firstAllowedLine();
        const currentLine = lineForView(appState.view);
        if (currentLine !== activeLine) {
          const first = itemsForLine(activeLine)[0]?.[0];
          appState.view = first || homeView(activeLine);
          return;
        }
        if (catalog[appState.view] && !isContracted(appState.view)) {
          const first = itemsForLine(activeLine)[0]?.[0];
          appState.view = first || homeView(activeLine);
        }
      }

      function updateLineHeader(){
        document.querySelectorAll("[data-app-line]").forEach(function(item){
          item.classList.toggle("is-active", item.dataset.appLine === appState.selectedLine && appState.view !== "settings");
        });
        document.querySelectorAll("[data-header-line]").forEach(function(item){
          item.classList.toggle("is-active", item.dataset.headerLine === appState.selectedLine && appState.view !== "settings");
        });
        document.querySelectorAll("[data-header-product]").forEach(function(item){
          item.classList.toggle("is-active", item.dataset.headerProduct === appState.view);
        });
        const label = document.getElementById("app-sidebar-line-label");
        if (label) label.textContent = lines[appState.selectedLine]?.label || "Legal";
      }

      function renderHeader(){
        const header = document.querySelector("header.site-header");
        if (!header) return;
        const nav = header.querySelector(".nav-panel");
        if (!nav) return;
        const lineIds = allowedLines();
        const signature = lineIds.map(function(lineId){
          return `${lineId}:${itemsForLine(lineId).map(function(item){ return item[0]; }).join(",")}`;
        }).join("|");
        if (nav.dataset.appHeader === "ready" && nav.dataset.allowedSignature === signature) return;
        nav.dataset.appHeader = "ready";
        nav.dataset.allowedSignature = signature;
        nav.dataset.aviaProductHeader = "ready";
        const lineButtons = lineIds.map(function(lineId){
          const line = lines[lineId];
          const options = itemsForLine(lineId).map(function(item){
            return `<button class="app-header-option" type="button" role="menuitem" data-header-product="${appEscape(item[0])}"><strong>${appEscape(item[3])}</strong><span>${appEscape(item[1])}<small>${appEscape(item[2])}</small></span></button>`;
          }).join("") || '<span class="app-header-empty">Sin productos disponibles</span>';
          return `<div class="app-header-menu"><button class="app-header-trigger" data-header-line="${appEscape(lineId)}" type="button" aria-haspopup="menu" aria-expanded="false">${appEscape(line.label)}</button><div class="app-header-dropdown" role="menu">${options}</div></div>`;
        }).join("");
        nav.innerHTML = lineButtons + '<button class="app-aurora-button" id="app-header-settings" type="button" aria-label="Abrir configuración"><img src="https://aviarockets.cl/bimi/logo.svg" alt="Aurora, asistente de AVIA Rockets"></button><button class="btn btn-primary btn-nav" id="app-header-logout" type="button">Cerrar sesión</button>';
        nav.querySelectorAll("[data-header-line]").forEach(function(button){
          button.addEventListener("click", function(){
            const menu = button.closest(".app-header-menu");
            const opening = !menu.classList.contains("is-open");
            nav.querySelectorAll(".app-header-menu.is-open").forEach(function(other){
              other.classList.remove("is-open");
              other.querySelector(".app-header-trigger")?.setAttribute("aria-expanded", "false");
            });
            menu.classList.toggle("is-open", opening);
            button.setAttribute("aria-expanded", String(opening));
          });
        });
        nav.querySelectorAll("[data-header-product]").forEach(function(button){
          button.addEventListener("click", async function(){
            appState.view = button.dataset.headerProduct || "legal-summary";
            appState.selectedLine = catalog[appState.view]?.line || appState.selectedLine;
            localStorage.setItem(LINE_KEY, appState.selectedLine);
            button.closest(".app-header-menu")?.classList.remove("is-open");
            await appRenderPanel();
          });
        });
        nav.querySelector("#app-header-settings")?.addEventListener("click", async function(){
          appState.view = "settings";
          await appRenderPanel();
        });
        nav.querySelector("#app-header-logout")?.addEventListener("click", function(){
          localStorage.removeItem("avia_auth_token");
          localStorage.removeItem("avia_auth_user");
          window.location.href = "login.html";
        });
        updateLineHeader();
      }

      async function selectLine(lineId){
        appState.selectedLine = lines[lineId] && isLineAllowed(lineId) ? lineId : firstAllowedLine();
        localStorage.setItem(LINE_KEY, appState.selectedLine);
        const first = itemsForLine(appState.selectedLine)[0]?.[0];
        appState.view = first || homeView(appState.selectedLine);
        await appRenderPanel();
      }

      function renderLineHome(lineId){
        const line = lines[lineId] || lines.legal;
        appSetText("app-view-label", line.eyebrow);
        appSetText("app-product-title", line.title);
        appSetText("app-product-description", line.description);
        appSetText("app-product-status", "Sin producto activo");
        appSetText("app-product-slug", line.id);
        const demo = document.getElementById("app-product-demo");
        if (demo) demo.innerHTML = `<div class="app-line-hook"><strong>${appEscape(line.label)}</strong><span>BotÃ³n superior activo. Los subproductos aparecerÃ¡n aquÃ­ cuando el perfil los tenga contratado desde la API.</span></div>`;
        const stats = document.querySelectorAll(".app-stat");
        const labels = ["Productos contratados", "Estado API", "ConexiÃ³n"];
        const values = [String(itemsForLine(line.id).length), "Pendiente", "Preparada"];
        stats.forEach(function(card, index){
          const small = card.querySelector("small");
          const strong = card.querySelector("strong");
          if (small) small.textContent = labels[index] || "-";
          if (strong) strong.textContent = values[index] || "-";
        });
        appSetText("app-config-title", "Productos contratados");
        const config = document.getElementById("app-product-config");
        if (config) {

      function renderPjudUploadProduct(){

      async function submitPjudUpload(form){
        const result = document.getElementById("pjud-upload-result");
        const file = form.querySelector("#pjud-file")?.files?.[0];
        const reportDate = form.querySelector("#pjud-report-date")?.value || new Date().toISOString().slice(0, 10);
        if (!file) {
          if (result) result.textContent = "Selecciona un archivo Excel.";
          return;
        }
        const body = new FormData();
        body.append("file", file);
        body.append("report_date", reportDate);
        if (result) result.textContent = "Procesando...";
        const token = appGetToken();
        const response = await fetch(`${AVIA_APP_API}/api/v1/legal/procurador-reports/uploads`, {
          method: "POST",
          headers: token ? { Authorization: `Bearer ${token}` } : {},
          body
        });
        let data = null;
        const text = await response.text();
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
        if (!response.ok) throw new Error(data?.detail || data?.message || text || `Error API ${response.status}`);
        const uploadSummary = data?.procurator_summary || data?.procurador_summary || data?.summary || data?.totals || data;
        if (uploadSummary && typeof uploadSummary === "object") {
          localStorage.setItem("avia_pjud_upload_summary", JSON.stringify(uploadSummary));
        }
        if (result) {
          const assigned = uploadSummary?.assigned_causes ?? uploadSummary?.assigned ?? uploadSummary?.causas_asignadas ?? uploadSummary?.matched_causes ?? uploadSummary?.matched;
          const total = uploadSummary?.total_causes ?? uploadSummary?.total ?? uploadSummary?.causas_totales ?? uploadSummary?.rows_total ?? uploadSummary?.processed;
          result.textContent = assigned !== undefined && total !== undefined ? `OK · ${assigned} de ${total} causas asignadas a procurador.` : "OK";
        }
      }

      let pjudControlReportIds = [];

      async function preparePjudControlEmail(){
        const statusNode = document.getElementById("pjud-control-status");
        const previewButton = document.getElementById("pjud-control-preview");
        const sendButton = document.getElementById("pjud-control-send");
        if (previewButton) {
          previewButton.disabled = true;
          previewButton.textContent = "Comparando...";
        }
        if (statusNode) statusNode.textContent = "Comparando el Ãºltimo dÃ­a disponible contra el penÃºltimo. Esto puede tardar cerca de un minuto...";
        if (sendButton) sendButton.disabled = true;
        try {
          const data = await appFetch("/api/v1/legal/procurador-reports/pjud-control-email/grouped-preview", {
            method: "POST",
            body: JSON.stringify({})
          });
          pjudControlReportIds = data.reports.map((report) => report.report_id);
          const previewRow = document.getElementById("pjud-control-preview-row");
          const previewText = document.getElementById("pjud-control-preview-text");
          const firstSummary = data.reports[0]?.summary || {};
          const reportDate = firstSummary.report_date || data.report_date || "-";
          const baseDate = firstSummary.base_dates?.[0] || "-";
          if (previewText) previewText.textContent =
            `COMPARACIÃ“N: ${reportDate} contra ${baseDate}\n` +
            `MÃ‰TODO: Ãºltimo dÃ­a disponible vs. penÃºltimo, sin horas fijas.\n\n` +
            data.reports.map((report, index) =>
              `CORREO ${index + 1} Â· ${report.portfolio_name}${report.group_label ? ` Â· ${report.group_label}` : ""}\n` +
              `Para: ${report.recipients.join(", ")}\n` +
              `BCC: ${[...report.bcc, "keanuavia@gmail.com"].filter((value, position, values) => values.indexOf(value) === position).join(", ")}\n` +
              `Asunto: ${report.subject}\n\n${report.text_preview}`
            ).join("\n\n" + "=".repeat(80) + "\n\n");
          if (previewRow) previewRow.hidden = false;
          if (statusNode) {
            statusNode.textContent = `${reportDate} vs ${baseDate} Â· ${data.totals.emails} correos respaldados Â· ${data.totals.con_cambios} cambios.`;
          }
          if (sendButton) sendButton.disabled = !pjudControlReportIds.length || data.reports.every((report) => report.status !== "draft");
        } finally {
          if (previewButton) {
            previewButton.disabled = false;
            previewButton.textContent = "Preparar correos por grupo";
          }
        }
      }

      async function sendPjudControlEmail(){
        if (!pjudControlReportIds.length) throw new Error("Primero genera y revisa los previews.");
        const accepted = window.confirm(`Â¿Confirmas el envÃ­o de ${pjudControlReportIds.length} correos legales, separados por portafolio?`);
        if (!accepted) return;
        const statusNode = document.getElementById("pjud-control-status");
        const sendButton = document.getElementById("pjud-control-send");
        if (sendButton) sendButton.disabled = true;
        if (statusNode) statusNode.textContent = "Encolando correo...";
        const data = await appFetch("/api/v1/legal/procurador-reports/pjud-control-email/send-all", {
          method: "POST",
          body: JSON.stringify({ confirm: true, report_ids: pjudControlReportIds })
        });
        if (statusNode) statusNode.textContent =
          `${data.queued} correos encolados Â· ${data.duplicates} duplicados omitidos.`;
      }

      function renderPlaceholderProduct(view){

      document.addEventListener("click", async function(event){
        const productButton = event.target.closest("[data-product-view]");
        if (productButton) {

      document.addEventListener("submit", async function(event){
