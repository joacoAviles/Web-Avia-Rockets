<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Completando acceso | AVIA Rockets</title><style>body{font-family:system-ui;background:#071426;color:#eaf2ff;margin:0}main{max-width:540px;margin:8vh auto;padding:28px;border:1px solid #425373;border-radius:24px}a{color:#9fc7ff}form{display:grid;gap:16px}label{display:grid;gap:7px}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #6c809f}button{cursor:pointer;background:#0a6cff;color:white}label.check{display:block}p[role=status]{min-height:1.5em}button:disabled{opacity:.6}</style></head><body><main><a href="/">AVIA Rockets</a><h1>Completando tu acceso</h1><p role="status" id="status">Un momento…</p><a href="/login.html">Volver al acceso</a></main><script src="identity-client.js"></script><script>
const ticket = new URLSearchParams(location.search).get('ticket');
history.replaceState(null, '', location.pathname);
if (!ticket) document.getElementById('status').textContent='El acceso no es válido. Vuelve a ingresar.';
else AVIAIdentity.redeem(ticket).catch(error => { document.getElementById('status').textContent=error.message; });
</script></body></html>
