services:
  infrastructure:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8080"
    env_file: .env
    shm_size: 256mb
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 0.75
    pids_limit: 384
    volumes:
      - browser-profile:/profile
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  browser-profile:
