<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In | AVIA Rockets</title>
<meta name="description" content="Ingresa a AVIA Rockets para administrar productos, paneles y automatización operacional, datos, APIs y apps internas." />
<link rel="canonical" href="https://aviarockets.cl/login.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="assets/avia-rockets-logo.svg?v=20260623-1" />
<meta name="theme-color" content="#071426" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="beta-products.css" />
<link rel="stylesheet" href="conversion.css" />
<style>
.auth-hero{min-height:calc(100vh - 78px);display:flex;align-items:center;padding:6rem 0 4rem;background:radial-gradient(circle at 14% 12%,rgba(10,108,255,.22),transparent 30%),radial-gradient(circle at 88% 24%,rgba(71,163,255,.13),transparent 28%)}
.auth-grid{width:min(100%,680px);margin:0 auto;display:block}
.auth-card{border:1px solid rgba(134,176,255,.22);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(7,20,38,.9);padding:clamp(1.25rem,4vw,2rem);box-shadow:0 26px 80px rgba(0,0,0,.28)}
.auth-form{display:grid;gap:.85rem}
.auth-form label{font-weight:750;color:var(--muted-2)}
.auth-form input{width:100%;border:1px solid rgba(134,176,255,.22);border-radius:14px;background:rgba(255,255,255,.045);color:var(--text);padding:.85rem}
.auth-status{margin:0;color:var(--muted);min-height:1.2rem;white-space:pre-line}
.auth-row{display:flex;align-items:center;justify-content:flex-start;gap:.65rem;font-size:.9rem}
.auth-row label{display:flex;align-items:center;gap:.5rem;color:var(--muted-2)}
.auth-row input{width:auto;padding:0;accent-color:#0a6cff}
@media(max-width:860px){.auth-hero{padding:5rem 0 3rem}.auth-card{border-radius:24px}}
</style>
</head>
<body data-page="auth">
<header class="site-header"></header>
<main>
<section class="auth-hero">
  <div class="container auth-grid">
    <div class="auth-card" aria-label="Ingreso AVIA Rockets">
      <form class="auth-form" id="login-form">
        <label for="login-identifier">Correo</label><input id="login-identifier" type="email" autocomplete="username" placeholder="cliente@empresa.cl" required />
        <label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required />
        <div class="auth-row"><label><input type="checkbox" /> Mantener sesión</label></div>
        <button class="btn btn-primary" id="login-button" type="submit">Ingresar</button><p class="auth-status" id="login-status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
</main>
<footer class="site-footer footer-clean"></footer>
<script src="api-config.js"></script>
<script src="header-standard.js"></script>
<script src="footer-standard.js?v=20260604-3"></script>
<script>
const PRIMARY_API_BASE_URL = (window.AVIA_API_BASE_URL_RESOLVED || window.AVIA_API_BASE_URL || "https://api.aviarockets.cl").replace(/\/$/, "");
const TOKEN_KEY = "avia_auth_token";
const USER_KEY = "avia_auth_user";
const DEFAULT_AFTER_LOGIN = "app.html";
const loginForm = document.getElementById("login-form");
const loginButton = document.getElementById("login-button");
const loginStatus = document.getElementById("login-status");

function setStatus(message, type = "") {
  loginStatus.hidden = false;
  loginStatus.textContent = message;
  loginStatus.className = `auth-status ${type}`.trim();
}

function getRedirectTarget() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next");
  return next && !next.startsWith("http") && !next.startsWith("//") ? next.replace("app-beta.html", "app.html") : DEFAULT_AFTER_LOGIN;
}

function getApiCandidates() {
  const candidates = [PRIMARY_API_BASE_URL, "https://api.aviarockets.cl", window.location.origin];
  return [...new Set(candidates.filter(Boolean).map((url) => String(url).replace(/\/$/, "")))];
}

async function apiRequestFrom(baseUrl, path, options = {}) {
  let response;
  try {
    response = await fetch(`${baseUrl}${path}`, {
      ...options,
      mode: "cors",
      cache: "no-store",
      headers: {
        Accept: "application/json",
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
  } catch (error) {
    throw new Error(`Sin conexión con ${baseUrl}: ${error.message || "fallo de red/CORS"}`);
  }

  let data = null;
  const text = await response.text();
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }

  if (!response.ok) {
    const code = data?.error;
    const msg = code === "INVALID_CREDENTIALS"
      ? "Usuario o contraseña incorrectos."
      : data?.detail || data?.message || code || text?.slice(0, 160) || `Error API ${response.status}`;
    throw new Error(`${baseUrl} respondió ${response.status}: ${msg}`);
  }

  return data;
}

async function apiRequest(path, options = {}) {
  const errors = [];
  for (const baseUrl of getApiCandidates()) {
    try {
      const data = await apiRequestFrom(baseUrl, path, options);
      localStorage.setItem("avia_api_base_url", baseUrl);
      return data;
    } catch (error) {
      errors.push(error.message || String(error));
    }
  }
  throw new Error(`No se pudo conectar con la API.\n${errors.join("\n")}`);
}

function saveSession(data) {
  localStorage.setItem(TOKEN_KEY, data.token);
  localStorage.setItem(USER_KEY, JSON.stringify(data.user));
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const identifier = document.getElementById("login-identifier").value.trim();
  const password = document.getElementById("login-password").value;
  if (!identifier || !password) {
    setStatus("Ingresa correo y contraseña.", "form-status-error");
    return;
  }
  loginButton.disabled = true;
  loginButton.textContent = "Entrando...";
  setStatus("Validando acceso...");
  try {
    const data = await apiRequest("/api/auth/login", { method: "POST", body: JSON.stringify({ email: identifier, password }) });
    saveSession(data);
    setStatus("Ingreso correcto. Redirigiendo...", "form-status-ok");
    window.location.href = getRedirectTarget();
  } catch (error) {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    setStatus(error.message || "No se pudo iniciar sesión.", "form-status-error");
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "Ingresar";
  }
});
</script>
</body>
</html>
