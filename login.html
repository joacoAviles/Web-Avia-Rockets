<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In | AVIA Rockets</title>
<meta name="description" content="Ingresa a AVIA Rockets para administrar productos, paneles y automatización operacional, datos, APIs y apps internas." />
<link rel="canonical" href="https://aviarockets.cl/login.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="assets/avia-rockets-logo.svg" />
<meta name="theme-color" content="#071426" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="beta-products.css" />
<style>
.auth-hero{min-height:calc(100vh - 78px);display:flex;align-items:center;padding:7rem 0 4rem;background:radial-gradient(circle at 14% 12%,rgba(10,108,255,.22),transparent 30%),radial-gradient(circle at 88% 24%,rgba(71,163,255,.13),transparent 28%)}
.auth-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:1.2rem;align-items:stretch}.auth-copy,.auth-card{border:1px solid rgba(134,176,255,.2);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(7,20,38,.88);padding:1.4rem;box-shadow:0 26px 80px rgba(0,0,0,.28)}.auth-copy h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:.95;margin:.6rem 0 1rem}.auth-copy p{color:var(--muted);max-width:62ch}.auth-form{display:grid;gap:.75rem}.auth-form label{font-weight:750;color:var(--muted-2)}.auth-form input{width:100%;border:1px solid rgba(134,176,255,.22);border-radius:14px;background:rgba(255,255,255,.045);color:var(--text);padding:.85rem}.auth-status{margin:0;color:var(--muted);min-height:1.2rem}.auth-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:.86rem}.auth-row a{color:var(--primary-3);text-decoration:none}@media(max-width:860px){.auth-grid{grid-template-columns:1fr}.auth-hero{padding:5rem 0 3rem}}
</style>
</head>
<body data-page="auth">
<header class="site-header"></header>
<main><section class="auth-hero"><div class="container auth-grid"><div class="auth-copy"><p class="eyebrow">Acceso AVIA Rockets</p><h1>Ingresa a tu cuenta.</h1><p>Administra Legal, Flota, Intelligence, API y Lab desde una sola entrada productiva.</p></div><div class="auth-card"><form class="auth-form" id="login-form"><label for="login-email">Correo</label><input id="login-email" type="email" autocomplete="email" required /><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required /><div class="auth-row"><label><input type="checkbox" /> Mantener sesión</label><a href="contacto.html">Necesito ayuda</a></div><button class="btn btn-primary" id="login-button" type="submit">Ingresar</button><p class="auth-status" id="login-status" aria-live="polite"></p></form></div></div></section></main>
<footer class="site-footer footer-clean"></footer>
<script src="header-standard.js"></script>
<script src="footer-standard.js"></script>
<script>
const API_BASE_URL = "https://api.aviarockets.cl";
const TOKEN_KEY = "avia_auth_token";
const USER_KEY = "avia_auth_user";
const DEFAULT_AFTER_LOGIN = "app.html";
const loginForm = document.getElementById("login-form");
const loginButton = document.getElementById("login-button");
const loginStatus = document.getElementById("login-status");
function setStatus(message, type = "") { loginStatus.hidden = false; loginStatus.textContent = message; loginStatus.className = `auth-status ${type}`.trim(); }
function getRedirectTarget() { const params = new URLSearchParams(window.location.search); const next = params.get("next"); return next && !next.startsWith("http") && !next.startsWith("//") ? next.replace("app-beta.html", "app.html") : DEFAULT_AFTER_LOGIN; }
async function apiRequest(path, options = {}) { const response = await fetch(`${API_BASE_URL}${path}`, { ...options, headers: { Accept: "application/json", "Content-Type": "application/json", ...(options.headers || {}) } }); let data = null; try { data = await response.json(); } catch (_) { data = null; } if (!response.ok) throw new Error(data?.detail || data?.message || `Error API ${response.status}`); return data; }
function saveSession(data) { localStorage.setItem(TOKEN_KEY, data.token); localStorage.setItem(USER_KEY, JSON.stringify(data.user)); }
loginForm.addEventListener("submit", async (event) => { event.preventDefault(); const email = document.getElementById("login-email").value.trim(); const password = document.getElementById("login-password").value; if (!email || !password) { setStatus("Ingresa correo y contraseña.", "form-status-error"); return; } loginButton.disabled = true; loginButton.textContent = "Entrando..."; setStatus("Validando usuario contra la API..."); try { const data = await apiRequest("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) }); saveSession(data); setStatus("Ingreso correcto. Redirigiendo a producción...", "form-status-ok"); window.location.href = getRedirectTarget(); } catch (error) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); setStatus(error.message || "No se pudo iniciar sesión.", "form-status-error"); } finally { loginButton.disabled = false; loginButton.textContent = "Ingresar"; } });
</script>
</body>
</html>
