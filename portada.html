<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avia Rockets · Portada</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portada.css"></head><body>
<header><a class="brand" href="app.html">AVIA <b>ROCKETS</b></a><span>Labs / Portada</span><span class="identity" id="email"></span></header>
<main><nav><button data-tab="editor" class="active">Portada</button><button data-tab="config">Configuración de portada</button></nav>
<section id="editor" class="tab active"><aside><label>Perfil<select id="profile"></select></label><label>Formato<select id="format"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option><option value="square">Cuadrado</option></select></label><label>Título<textarea id="title">START BROKEN.</textarea></label><label>Subtítulo<textarea id="subtitle">finish sharp</textarea></label><label class="check"><input type="checkbox" id="guides" checked> Mostrar zonas seguras</label><div id="layers"></div><button id="export" class="primary">Exportar PNG</button><p id="message"></p></aside><div class="stage"><canvas id="canvas"></canvas><p>Arrastra para mover · usa el control de la esquina para redimensionar</p></div></section>
<section id="config" class="tab"><aside><div class="actions"><button id="new">Nuevo</button><button id="duplicate">Duplicar</button><button id="save" class="primary">Guardar</button></div><label>Nombre<input id="cfgName"></label><label>Red social<input id="cfgNetwork"></label><label>Formato<select id="cfgFormat"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option><option value="square">Cuadrado</option></select></label><label>Estado<select id="cfgStatus"><option value="draft">Borrador</option><option value="published">Publicado</option><option value="archived">Archivado</option></select></label><label>Fondo<input id="cfgBackground" type="color"></label><fieldset><legend>Zona segura (%)</legend><div class="quad"><input id="safeLeft" type="number" title="Izquierda"><input id="safeTop" type="number" title="Arriba"><input id="safeRight" type="number" title="Derecha"><input id="safeBottom" type="number" title="Abajo"></div></fieldset><h3>Capas</h3><div id="cfgLayers"></div><div class="actions"><button data-add="text">+ Texto</button><button data-add="rect">+ Forma</button><button data-add="grid">+ Grid</button><button data-add="topography">+ Topografía</button><button data-add="image">+ Imagen/logo</button></div><button id="delete" class="danger">Borrar perfil</button></aside><div class="stage"><canvas id="configCanvas"></canvas><p>Todo el diseño se guarda en la definición del perfil.</p></div></section></main>
<script type="module" src="portada.js"></script></body></html>
